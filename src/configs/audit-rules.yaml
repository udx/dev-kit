kind: auditRules
version: udx.dev/dev.kit/v1
description: Gap messages and guidance for missing or partial repo factors

config:
  rules:
    - id: missing-documentation
      factor: documentation
      status: missing
      message: Add a README so repo consumers can orient quickly around purpose, workflow, and boundaries.
    - id: partial-dependency-contract
      factor: dependencies
      status: partial
      message: Custom execution-shaping contracts exist, but they are not traced clearly yet. Prefer versioned manifests, reusable workflow refs, image refs, or in-repo docs/source links over implicit tool knowledge.
    - id: missing-dependency-contract
      factor: dependencies
      status: missing
      message: No meaningful external contract was detected. When repo behavior depends on external workflows, images, or custom manifests, add metadata or docs that trace those relationships clearly.
    - id: partial-config-contract
      factor: config
      status: partial
      message: Config signals exist, but the repo does not declare a clear configuration contract yet. Document required config in repo-owned docs, manifest metadata, or checked-in example files when they fit the repo design.
    - id: missing-config-contract
      factor: config
      status: missing
      message: No explicit configuration contract was detected. Add repo-owned docs, manifest metadata, or checked-in example files that explain the required configuration.
    - id: partial-pipeline
      factor: pipeline
      status: partial
      message: Some CI/CD signals detected but the pipeline is incomplete. Add workflow files, test commands, or deploy configuration.
    - id: missing-pipeline
      factor: pipeline
      status: missing
      message: No CI/CD pipeline detected. Add GitHub workflows, test commands, or deploy configuration so the repo can be validated and deployed.
