kind: repoArchetypes
version: udx.dev/dev.kit/v1
description: Minimal repo-level archetype definitions

config:
  archetypes:
    workflow-repo:
      description: Repo whose primary contract is reusable GitHub workflow behavior
      required:
        - workflow:github
        - repo:workflow-primary
    manifest-repo:
      description: Repo centered on repo-owned manifests and declarative contracts
      required:
        - contract:manifest
    repo-standard:
      description: General repo standard with traceable refs, manifests, and repair surfaces
      required:
        - repo:detected
