kind: detectionSignals
version: udx.dev/dev.kit/v1
description: File, directory, and glob signals for factor and dependency detection

config:
  documentation_files:
    - README.md
    - README
    - readme.md
  documentation_hub_files:
    - docs/README.md
    - docs/readme.md
  markdown_file_globs:
    - README*
    - docs/*.md
    - docs/**/*.md
  prune_dirs:
    - .git
    - node_modules
    - .next
    - .nuxt
    - .svelte-kit
    - .output
    - .contentlayer
    - .turbo
    - vendor
    - dist
    - .venv
    - venv
    - .terraform
    - build
    - coverage
    - .cache
    - target
    - out
    - tmp
    - artifacts
  makefiles:
    - Makefile
    - makefile
    - GNUmakefile
  container_files:
    - Dockerfile
    - docker-compose.yml
    - docker-compose.yaml
  config_contract_files:
    - .env.example
    - .env.sample
    - .env.template
  config_runtime_files:
    - docker-compose.yml
    - docker-compose.yaml
    - deploy.yml
    - deploy.yaml
  test_dirs:
    - tests
    - test
    - spec
  example_dirs:
    - examples
    - fixtures
  workflow_globs:
    - .github/workflows/*.yml
    - .github/workflows/*.yaml
  workflow_primary_files:
    - action.yml
    - action.yaml
  deploy_files:
    - deploy.yml
    - deploy.yaml
    - docker-compose.yml
    - docker-compose.yaml
  yaml_manifest_globs:
    - "*.yaml"
    - "*.yml"
  # External dependency tracing — files and dirs to scan for cross-repo references.
  # Shell code reads these lists and applies pattern-specific extraction.
  dependency_trace_workflow_dirs:
    - .github/workflows
  dependency_trace_container_files:
    - Dockerfile
  # Dirs scanned recursively for YAML files with kind/version headers.
  # Version URIs are normalized into source repo contracts when possible.
  dependency_trace_versioned_dirs:
    - .rabbit
  # Docker Compose files scanned for image: references.
  dependency_trace_compose_files:
    - docker-compose.yml
    - docker-compose.yaml
  manifest_config_dirs:
    - src/configs
    - configs
    - cd/configs
  manifest_backend_module_dirs:
    - cd/terraform/modules
    - terraform/modules
    - modules
  manifest_root_files:
    - deploy.yml
    - deploy.yaml
    - docker-compose.yml
    - docker-compose.yaml
    - Chart.yaml
    - helmfile.yaml
    - evals/promptfooconfig.yaml
